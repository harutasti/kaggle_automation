[project]
name = "kaggle-experiment"
version = "0.1.0"
description = "AutoKaggle experiment environment"
requires-python = ">=3.10"
dependencies = [
    # Core data science
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "polars>=0.19.0",

    # Machine Learning
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "imbalanced-learn>=0.12.0",
    "category-encoders>=2.6.0",
    "statsmodels>=0.14.0",
    "shap>=0.44.0",
    "transformers>=4.44,<5",

    # Deep Learning (commonly needed)
    "torch>=2.0.0",

    # Hyperparameter tuning
    "optuna>=3.3.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Utilities
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
]

[tool.uv]
dev-dependencies = []
